<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE - Portal do Professor</title>
    <!-- Ícones FontAwesome para ficar idêntico ao SGE -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            background-color: #f5f6f8; 
            padding-bottom: 40px; 
        }
        
        /* Cabeçalho Principal (Azul Escuro) */
        .top-header {
            background-color: #004080; 
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            height: 40px;
        }
        .top-header-left { display: flex; align-items: center; gap: 10px; }
        .top-header-left .logo-icon { font-size: 24px; }
        .top-header-left .logo-text { line-height: 1.1; }
        .top-header-left strong { font-size: 16px; letter-spacing: 1px; }
        .top-header-left span { font-size: 9px; display: block; }
        
        .top-header-right { display: flex; align-items: center; gap: 15px; font-size: 14px; }
        .top-header-right i.fa-birthday-cake { color: #ff9999; cursor: pointer; }
        .top-header-right i.fa-envelope { cursor: pointer; }
        .top-header-right i.fa-bell { color: #ffcc00; cursor: pointer; }
        .top-btn {
            background: white; color: #333; border: 1px solid #ccc;
            padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; gap: 5px;
        }

        /* Sub-Cabeçalho (Branco com menus) */
        .sub-header {
            background-color: white; border-bottom: 1px solid #ccc;
            display: flex; align-items: center; height: 45px; padding: 0 20px;
        }
        .module-title {
            color: #0066cc; font-weight: bold; font-size: 15px;
            display: flex; align-items: center; gap: 8px;
            padding-right: 20px; border-right: 1px solid #ddd; height: 100%;
        }
        .menu { display: flex; height: 100%; }
        .menu button {
            background: none; border: none; color: #555;
            font-size: 13px; cursor: pointer; padding: 0 15px;
            display: flex; align-items: center; gap: 6px; height: 100%;
            border-right: 1px solid #eee;
        }
        .menu button i { color: #0066cc; }
        .menu button:hover, .menu button.active {
            color: #0066cc; background-color: #f0f7ff; font-weight: bold;
        }

        /* Rodapé Fixo */
        .footer {
            background-color: #004080; color: white;
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 20px; font-size: 11px;
            position: fixed; bottom: 0; width: 100%; box-sizing: border-box;
        }
        .footer-links { display: flex; gap: 15px; }
        .footer-links span { display: flex; align-items: center; gap: 5px; cursor: pointer; }

        /* Conteúdo Principal */
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 4px; border: 1px solid #ddd; }
        .tab-content.active { display: block; }
        
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 15px; }
        .book-card { border: 1px solid #eee; padding: 15px; border-radius: 4px; background: #fafafa; border-left: 4px solid #0066cc; }
        .tag-digital { background: #2ecc71; color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; text-decoration: none;}
        .tag-fisico { background: #e67e22; color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; }
        
        input, select { width: 100%; padding: 8px; margin-top: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;}
        button.action-btn { background: #0066cc; color: white; cursor: pointer; border: none; margin-top: 15px; padding: 10px 20px; border-radius: 4px; font-weight: bold;}
        button.action-btn:hover { background: #00509e; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- Cabeçalho Idêntico ao SGE -->
    <header class="top-header">
        <div class="top-header-left">
            <i class="fas fa-graduation-cap logo-icon"></i>
            <div class="logo-text">
                <strong>CLM</strong>
                <span>CENTRO DE LÍNGUAS MARACANAÚ</span>
            </div>
        </div>
        <div class="top-header-right">
            <i class="fas fa-birthday-cake"></i>
            <i class="fas fa-envelope"></i>
            <i class="fas fa-bell"></i>
            <button class="top-btn"><i class="fas fa-th-large"></i> Módulos</button>
            <button class="top-btn"><i class="fas fa-user"></i> PROFESSOR</button>
            <button class="top-btn">2026</button>
        </div>
    </header>

    <!-- Sub-Cabeçalho com Menus Idêntico ao SGE -->
    <nav class="sub-header">
        <div class="module-title">
            <i class="fas fa-book-open"></i> Paradidáticos
        </div>
        <div class="menu">
            <button class="tab-link active" onclick="openTab('catalogo', this)"><i class="fas fa-list"></i> Catálogo de Livros</button>
            <button class="tab-link" onclick="openTab('sugerir', this)"><i class="fas fa-lightbulb"></i> Sugerir Paradidático</button>
        </div>
    </nav>

    <div class="container">
        <!-- Catálogo -->
        <div id="catalogo" class="tab-content active">
            <h3 style="color:#004080; margin-top:0;">Livros Disponíveis por Semestre</h3>
            <div class="form-group" style="max-width: 300px;">
                <label style="font-weight: bold; color: #555;">Filtrar Acervo:</label>
                <select id="semestreFilter" autocomplete="off" onchange="filtrarLivros()">
                    <option value="1">Semestre 1</option>
                    <option value="2">Semestre 2</option>
                    <option value="3">Semestre 3</option>
                    <option value="4">Semestre 4</option>
                    <option value="5">Semestre 5</option>
                    <option value="6">Semestre 6</option>
                    <option value="7">Semestre 7</option>
                </select>
            </div>
            <div class="book-grid" id="listaLivrosCatalogo"></div>
        </div>

        <!-- Sugerir -->
        <div id="sugerir" class="tab-content">
            <h3 style="color:#004080; margin-top:0;">Sugerir Novo Livro Literário</h3>
            <p style="color: #666; font-size: 14px;">Sua sugestão será enviada e salva no Firebase para avaliação da coordenação.</p>
            <div class="form-group">
                <label style="font-weight: bold; color: #555;">Título do Livro e Autor:</label>
                <input type="text" id="sug_titulo" autocomplete="off" placeholder="Ex: The Little Prince - Antoine de Saint-Exupéry">
            </div>
            <div class="form-group">
                <label style="font-weight: bold; color: #555;">Semestre Recomendado:</label>
                <select id="sug_semestre" autocomplete="off">
                    <option value="Semestre 1">Semestre 1</option>
                    <option value="Semestre 2">Semestre 2</option>
                    <option value="Semestre 3">Semestre 3</option>
                    <option value="Semestre 4">Semestre 4</option>
                    <option value="Semestre 5">Semestre 5</option>
                    <option value="Semestre 6">Semestre 6</option>
                    <option value="Semestre 7">Semestre 7</option>
                </select>
            </div>
            <div class="form-group">
                <label style="font-weight: bold; color: #555;">Link (Site, PDF ou YouTube):</label>
                <input type="text" id="sug_link" autocomplete="off" placeholder="Cole o URL completo aqui">
            </div>
            <button class="action-btn" id="btnEnviarSugestao"><i class="fas fa-paper-plane"></i> Enviar Sugestão</button>
        </div>
    </div>

    <!-- Rodapé Idêntico ao SGE -->
    <footer class="footer">
        <div class="footer-links">
            <span><i class="fas fa-video"></i> Tutoriais</span>
            <span><i class="fas fa-book"></i> BCM</span>
            <span><i class="fas fa-file-alt"></i> Formar Integralmente</span>
            <span><i class="fas fa-chart-line"></i> Política Especial de Recuperação</span>
            <span><i class="fas fa-heart"></i> Qualidade de Vida</span>
        </div>
        <div>CLM 1.0.0</div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD5aBrCz8rRAYLyqkD2WIlUwXy6P_U3Roo",
            authDomain: "projeto-literario-f8c24.firebaseapp.com",
            projectId: "projeto-literario-f8c24",
            messagingSenderId: "129154242671",
            appId: "1:129154242671:web:a66a98213e9c4f4f6c159a"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- ACERVO HARDCODED ---
        const acervo = [
            { sem: 1, titulo: "The umbrella - Clare Harris", qtd: "10 livros", link: "https://www.youtube.com/watch?v=4UY9ixf4HiY" },
            { sem: 1, titulo: "Gulliver's travels in Lilliput - Jonatahn Swift", qtd: "14 livros", link: "" },
            { sem: 1, titulo: "Rich man, poor man - T.C Jupp", qtd: "16 livros", link: "" },
            { sem: 1, titulo: "Lucky number -John Milne", qtd: "9 livros", link: "" },
            { sem: 2, titulo: "The lost ship - Stephen Colbourn", qtd: "12 livros", link: "https://www.youtube.com/watch?v=QK-P6jkXYuk" },
            { sem: 2, titulo: "Alissa - C.J. Moore", qtd: "11 livros", link: "" },
            { sem: 2, titulo: "Sara says No! - Norman Whitney", qtd: "14 livros", link: "" },
            { sem: 3, titulo: "This is London -Philip Prowse", qtd: "21 livros", link: "" },
            { sem: 3, titulo: "The truth machine -Norman whitney", qtd: "21 livros", link: "" },
            { sem: 3, titulo: "Anna and the fighter - Elizabeth Laird", qtd: "11 livros", link: "" },
            { sem: 3, titulo: "Good humor - Hans C. Andersen", qtd: "Digital", link: "http://www.dominiopublico.gov.br/pesquisa/DetalheObraForm.do?select_action=&co_obra=609" },
            { sem: 3, titulo: "Great grandfather - Hans C. Andersen", qtd: "Digital", link: "http://www.dominiopublico.gov.br/pesquisa/DetalheObraForm.do?select_action=&co_obra=6094" },
            { sem: 4, titulo: "The last of the Mohicans - James F. Cooper", qtd: "16 livros", link: "" },
            { sem: 4, titulo: "The wedding gift -Guy de Maupassant", qtd: "Digital", link: "http://www.dominiopublico.gov.br/pesquisa/DetalheObraForm.do?select_action=&co_obra=6996" },
            { sem: 5, titulo: "A message from the sea - Charles Dickens", qtd: "Digital", link: "http://www.dominiopublico.gov.br/download/texto/gu001407.pdf" },
            { sem: 5, titulo: "The man in the iron mask -Alexandre Dumas", qtd: "20 livros", link: "" },
            { sem: 6, titulo: "The three ghost stories -Charles Dickens", qtd: "Digital", link: "http://www.dominiopublico.gov.br/download/texto/pp000007.pdf" },
            { sem: 7, titulo: "Story teller", qtd: "Digital", link: "https://educapes.capes.gov.br/bitstream/capes/63069/1/edgar_allan_poe_storyteller_AE.pdf" }
        ];

        // --- FUNÇÕES GLOBAIS ---
        window.openTab = function(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-link').forEach(link => link.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            element.classList.add('active');
        };

        window.filtrarLivros = function() {
            const sem = parseInt(document.getElementById('semestreFilter').value);
            const grid = document.getElementById('listaLivrosCatalogo');
            grid.innerHTML = '';
            
            const livrosFiltrados = acervo.filter(l => l.sem === sem);
            
            livrosFiltrados.forEach(livro => {
                const badge = livro.qtd === "Digital" ? '<span class="tag-digital"><i class="fas fa-desktop"></i> Digital</span>' : `<span class="tag-fisico"><i class="fas fa-book"></i> ${livro.qtd}</span>`;
                const linkDiv = livro.link ? `<br><br><a href="${livro.link}" target="_blank" class="tag-digital" style="background:#3498db;"><i class="fas fa-external-link-alt"></i> Acessar Material</a>` : '<p style="color:#7f8c8d; font-size:12px; margin-bottom:0;"><i class="fas fa-info-circle"></i> Agendar fisicamente.</p>';
                
                grid.innerHTML += `
                    <div class="book-card">
                        <h4 style="margin-top:0; color:#333; font-size:15px;">${livro.titulo}</h4>
                        ${badge}
                        ${linkDiv}
                    </div>
                `;
            });
        };

        // --- ENVIO DA SUGESTÃO ---
        document.getElementById('btnEnviarSugestao').addEventListener('click', async () => {
            const titulo = document.getElementById('sug_titulo').value;
            const semestre = document.getElementById('sug_semestre').value;
            const link = document.getElementById('sug_link').value;

            if(!titulo || !link) {
                alert("Por favor, preencha o título e o link.");
                return;
            }

            try {
                await addDoc(collection(db, "sugestoes"), {
                    titulo: titulo,
                    semestre: semestre,
                    link: link,
                    dataEnvio: new Date().toISOString()
                });
                alert("Sua sugestão foi enviada com sucesso para a coordenação!");
                document.getElementById('sug_titulo').value = '';
                document.getElementById('sug_link').value = '';
            } catch (error) {
                console.error("Erro ao enviar: ", error);
                alert("Ocorreu um erro ao enviar a sugestão. Tente novamente.");
            }
        });

        // Inicializa a primeira filtragem
        window.filtrarLivros();
    </script>
</body>
</html>
