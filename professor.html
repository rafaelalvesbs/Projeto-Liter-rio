<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLM - Portal do Professor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; }
        .header { background: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .menu { display: flex; gap: 15px; background: #34495e; padding: 10px 20px; }
        .menu button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 5px 10px; }
        .menu button.active { border-bottom: 2px solid #3498db; }
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-content.active { display: block; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .book-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
        .tag-digital { background: #2ecc71; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .tag-fisico { background: #e67e22; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        input, select, button.btn { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button.btn { background: #3498db; color: white; cursor: pointer; border: none; margin-top: 15px; }
        button.btn:hover { background: #2980b9; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Centro de Línguas Maracanaú - Professores</h2>
        <span>Bem-vindo(a), Professor(a)</span>
    </div>

    <div class="menu">
        <button class="tab-link active" onclick="openTab('catalogo', this)">Catálogo e Agendamento</button>
        <button class="tab-link" onclick="openTab('sugerir', this)">Sugerir Paradidático</button>
        <button class="tab-link" onclick="openTab('meu-cronograma', this)">Meu Cronograma</button>
    </div>

    <div class="container">
        <!-- Tab: Catálogo -->
        <div id="catalogo" class="tab-content active">
            <h3>Livros Disponíveis</h3>
            <div class="form-group">
                <label>Filtrar por Semestre:</label>
                <select id="semestreFilter" autocomplete="off">
                    <option value="1">Semestre 1</option>
                    <option value="2">Semestre 2</option>
                    <option value="3">Semestre 3</option>
                </select>
            </div>
            <div class="book-grid" id="listaLivrosCatalogo">
                <p>O acervo carregará os dados do banco aqui em breve.</p>
            </div>
        </div>

        <!-- Tab: Sugerir -->
        <div id="sugerir" class="tab-content">
            <h3>Sugerir Novo Livro Literário</h3>
            <p>Envie sua sugestão para a coordenação avaliar.</p>
            <div class="form-group">
                <label>Título do Livro:</label>
                <input type="text" id="sug_titulo" autocomplete="off" placeholder="Ex: The Little Prince">
            </div>
            <div class="form-group">
                <label>Semestre Recomendado:</label>
                <input type="text" id="sug_semestre" autocomplete="off" placeholder="Ex: Semestre 3">
            </div>
            <div class="form-group">
                <label>Link para o material (se digital):</label>
                <input type="text" id="sug_link" autocomplete="off" placeholder="Cole o URL aqui (opcional)">
            </div>
            <button class="btn" id="btnEnviarSugestao">Enviar Sugestão</button>
        </div>

        <!-- Tab: Meu Cronograma -->
        <div id="meu-cronograma" class="tab-content">
            <h3>Minhas Leituras Agendadas</h3>
            <p>Nenhuma leitura agendada ainda.</p>
        </div>
    </div>

    <!-- Script como módulo -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD5aBrCz8rRAYLyqkD2WIlUwXy6P_U3Roo",
            authDomain: "projeto-literario-f8c24.firebaseapp.com",
            projectId: "projeto-literario-f8c24",
            messagingSenderId: "129154242671",
            appId: "1:129154242671:web:a66a98213e9c4f4f6c159a"
        };

        // Inicializa o app e o banco de dados (Firestore)
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Torna a função de abas global
        window.openTab = function(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-link').forEach(link => link.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            element.classList.add('active');
        };

        // Lógica de Envio de Sugestão para a coleção "sugestoes"
        document.getElementById('btnEnviarSugestao').addEventListener('click', async () => {
            const titulo = document.getElementById('sug_titulo').value;
            const semestre = document.getElementById('sug_semestre').value;
            const link = document.getElementById('sug_link').value;

            if(!titulo || !semestre) {
                alert("Por favor, preencha o título e o semestre.");
                return;
            }

            try {
                await addDoc(collection(db, "sugestoes"), {
                    titulo: titulo,
                    semestre: semestre,
                    link: link,
                    status: "Pendente",
                    dataEnvio: new Date().toISOString()
                });
                alert("Sugestão enviada para a coordenação!");
                document.getElementById('sug_titulo').value = '';
                document.getElementById('sug_semestre').value = '';
                document.getElementById('sug_link').value = '';
            } catch (error) {
                console.error("Erro ao enviar: ", error);
                alert("Erro ao enviar a sugestão.");
            }
        });
    </script>
</body>
</html>
